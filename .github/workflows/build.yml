name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK: app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK 37 ve Build Tools kurulumu
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri ve debug imzalı release APK
        run: bash ./gradlew --console=plain testDebugUnitTest assembleRelease

      - name: APK imzasını ve izinlerini doğrula
        shell: bash
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          certificate=$("$build_tools/apksigner" verify --print-certs "$APK")
          grep -Eq '^Signer #1 certificate DN: .*CN=Android Debug(,|$)' <<< "$certificate"

          package='com.semih007.ekstretakip'
          allowed="$package.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          permissions=$("$build_tools/aapt2" dump permissions "$APK")
          printf '%s\n' "$permissions"
          grep -Fxq "package: $package" <<< "$permissions"
          while IFS= read -r line; do
            case "$line" in
              "package: $package"|"permission: $allowed"|"uses-permission: name='$allowed'"|'') ;;
              *) echo "::error::Beklenmeyen APK izin kaydı: $line"; exit 1 ;;
            esac
          done <<< "$permissions"

      - uses: actions/upload-artifact@v4
        with:
          name: ekstre-takip-apk
          path: ${{ env.APK }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ekstre-takip-apk
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/app-release.apk
          fail_on_unmatched_files: true
